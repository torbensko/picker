name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned packages
        run: xcodebuild -resolvePackageDependencies -project Picker.xcodeproj -scheme Picker -derivedDataPath build -onlyUsePackageVersionsFromResolvedFile
      - name: Test
        run: xcodebuild -project Picker.xcodeproj -scheme Picker -configuration Debug -destination 'platform=macOS' -derivedDataPath build test CODE_SIGN_IDENTITY=-
      - name: Build universal preview
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package.sh --unsigned
      - name: Verify signed update packaging with generated fixtures
        run: ./scripts/test-appcast.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview
          path: |
            dist/Picker-unsigned.dmg
            dist/Picker-unsigned.zip
            dist/SHA256SUMS-unsigned.txt
          if-no-files-found: error
